name: release

on:
  push:
    tags: ["v*"]
  # Dry run: builds and notarizes for real, publishes nothing.
  workflow_dispatch:

# No cancel-in-progress here, unlike ci.yml: a superseded test matrix is just
# wasted compute, but a cancelled release can leave a GitHub Release created
# and the Homebrew tap un-pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write # OIDC auth for the MCP Registry publish (no secret needed)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout can leave the tag object shallow, and the changelog needs the
      # full range between tags.
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            ${{ github.event_name == 'workflow_dispatch'
                && 'release --clean --snapshot --skip=publish'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
      - name: Verify every archive carries all three binaries
        # The runtime requires zordon, alpha and tommy to land in one
        # directory; an archive missing one produces a stack that either
        # cannot start or silently runs services unwrapped.
        run: |
          set -euo pipefail
          # Platform archives are zordon_<version>_<os>_<arch>.tar.gz; the
          # source archive is zordon-<version>.tar.gz, and the underscore is
          # what keeps it out of this glob.
          #
          # The listing is read once into a variable rather than piped into
          # `grep -q`: grep exits on its first match, tar then fails writing
          # to the closed pipe, and pipefail reports that as the pipeline's
          # status — so a successful match intermittently reads as a missing
          # binary, depending on whether tar finished first.
          for archive in dist/zordon_*.tar.gz; do
            listing=$(tar -tzf "$archive")
            for binary in zordon alpha tommy; do
              grep -qx "$binary" <<<"$listing" \
                || { echo "$archive is missing $binary"; exit 1; }
            done
            echo "ok $archive"
          done
      - name: Build MCP bundles
        # Repackage the signed release binaries into .mcpb: one per platform
        # plus one universal bundle for the MCP Registry. Reads from the
        # tarballs above, so a bundle can never contain a differently-built
        # binary than the tarball for its platform.
        run: python3 scripts/build-mcpb.py --dist dist
      - name: Verify every bundle carries manifest and all binaries
        run: |
          set -euo pipefail
          platforms="darwin_arm64 darwin_amd64 linux_amd64 linux_arm64"
          for bundle in dist/zordon_*.mcpb; do
            listing=$(unzip -Z1 "$bundle")
            case "$bundle" in
              *_universal.mcpb)
                entries="manifest.json server/launch"
                for p in $platforms; do
                  for b in zordon alpha tommy; do entries="$entries server/$p/$b"; done
                done ;;
              *)
                entries="manifest.json server/zordon server/alpha server/tommy" ;;
            esac
            for entry in $entries; do
              grep -qx "$entry" <<<"$listing" \
                || { echo "$bundle is missing $entry"; exit 1; }
            done
            echo "ok $bundle"
          done
      - name: Upload bundles to the release
        # goreleaser already created the release; attach the bundles to it.
        # Skipped on the workflow_dispatch dry run, which publishes nothing.
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.mcpb --clobber
      - name: Publish to the MCP Registry
        # Stamp server.json with this release's version, the universal bundle's
        # download URL, and its checksum, then publish. OIDC proves the
        # io.github.piotrkowalczuk namespace, so no secret is needed. Runs after
        # the bundle is on the release, since the registry fetches and verifies
        # it. Skipped on the workflow_dispatch dry run.
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="zordon_${version}_universal.mcpb"
          url="https://github.com/piotrkowalczuk/zordon/releases/download/${GITHUB_REF_NAME}/${bundle}"
          sha="$(sha256sum "dist/${bundle}" | cut -d' ' -f1)"
          jq --arg v "$version" --arg url "$url" --arg sha "$sha" \
            '.version=$v | .packages[0].identifier=$url | .packages[0].fileSha256=$sha' \
            server.json > server.published.json && mv server.published.json server.json
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.mcpb
          retention-days: 7
