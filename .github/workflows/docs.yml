name: docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "skills/**"
      - "scripts/agent-skills-index.py"
      - ".well-known/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Public by design: the same value is served at https://zordon.io/$INDEXNOW_KEY.txt.
env:
  INDEXNOW_KEY: 173916922f4516ba509a10bda44e3e11
  INDEXNOW_HOST: zordon.io

# One concurrent deploy; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-llmstxt
      - run: mkdocs build --strict --site-dir _site
      - run: python3 scripts/agent-skills-index.py _site
      # MkDocs skips dot-directories, so .well-known files are copied into the
      # built site directly (same reason the agent-skills index is written here).
      - run: mkdir -p _site/.well-known && cp .well-known/ai-catalog.json _site/.well-known/
      - name: Verify IndexNow key file is published
        run: |
          test -f "_site/${INDEXNOW_KEY}.txt"
          test "$(cat "_site/${INDEXNOW_KEY}.txt")" = "$INDEXNOW_KEY"
      - name: Verify agent-facing artifacts are published
        run: |
          test -s _site/llms.txt
          test -s _site/llms-full.txt
          python3 -c "
          import hashlib, json, pathlib
          site = pathlib.Path('_site')
          index = json.loads((site / '.well-known/agent-skills/index.json').read_text())
          assert index['skills'], 'skills index is empty'
          for skill in index['skills']:
              served = site / skill['url'].lstrip('/')
              digest = 'sha256:' + hashlib.sha256(served.read_bytes()).hexdigest()
              assert digest == skill['digest'], f\"{skill['name']}: digest does not match served file\"
          print(f\"agent-skills: verified {len(index['skills'])} skills\")
          "
      - name: Verify the ARD catalog is published
        run: |
          python3 -c "
          import json, pathlib, re
          catalog = json.loads((pathlib.Path('_site') / '.well-known/ai-catalog.json').read_text())
          assert catalog['specVersion'] == '1.0', 'unexpected specVersion'
          entries = catalog['entries']
          assert entries, 'catalog has no entries'
          urn = re.compile(r'^urn:air:[a-zA-Z0-9.-]+(:[a-zA-Z0-9._-]+)+\$')
          for entry in entries:
              for field in ('identifier', 'displayName', 'type'):
                  assert entry.get(field), f'entry missing {field}'
              assert urn.match(entry['identifier']), f\"bad URN: {entry['identifier']}\"
              assert ('url' in entry) ^ ('data' in entry), 'entry needs exactly one of url/data'
              queries = entry.get('representativeQueries', [])
              assert 2 <= len(queries) <= 5, 'representativeQueries must hold 2-5 items'
          print(f'ard: verified {len(entries)} catalog entrie(s)')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail

          # Pages serves the fresh sitemap only once the CDN catches up with the deploy.
          urls=$(curl -fsSL --max-time 30 --retry 6 --retry-delay 10 --retry-all-errors \
            "https://${INDEXNOW_HOST}/sitemap.xml" \
            | grep -oE '<loc>[^<]+</loc>' | sed -E 's|</?loc>||g')
          test -n "$urls"

          payload=$(jq -Rn --arg host "$INDEXNOW_HOST" --arg key "$INDEXNOW_KEY" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: [inputs | select(length > 0)]}' \
            <<<"$urls")
          echo "Submitting $(jq '.urlList | length' <<<"$payload") URLs"

          code=$(curl -sS -o response.txt -w '%{http_code}' --max-time 30 \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$payload" https://api.indexnow.org/indexnow)
          echo "IndexNow responded $code"
          cat response.txt
          case "$code" in
            200 | 202) ;;
            *) exit 1 ;;
          esac
