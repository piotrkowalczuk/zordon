name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - debian:11
          - fedora:latest
          - archlinux:latest
        example:
          - simple
          - federation
          - worktree
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install dependencies
        run: |
          if [ -x "$(command -v apt-get)" ]; then apt-get update && apt-get install -y git golang-go; fi
          if [ -x "$(command -v dnf)" ]; then dnf install -y git golang; fi
          if [ -x "$(command -v pacman)" ]; then pacman -Syu --noconfirm git go; fi
      - uses: actions/checkout@v4
      - name: Build Zordon
        run: go build -o zordon ./cmd/zordon/
      - name: Run Privileged Hooks
        run: sudo ./zordon sudo
      - name: Run E2E Test
        run: |
          cd examples/${{ matrix.example }}
          chmod +x test.sh
          ../../zordon start --agent
          ./test.sh
          ../../zordon stop --agent

