name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - debian:11
          - fedora:latest
          - archlinux:latest
        example:
          - simple
          - federation
          - worktree
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install dependencies
        run: |
          if [ -x "$(command -v apt-get)" ]; then apt-get update && apt-get install -y git golang-go; fi
          if [ -x "$(command -v dnf)" ]; then dnf install -y git golang; fi
          if [ -x "$(command -v pacman)" ]; then pacman -Syu --noconfirm git go; fi
      - uses: actions/checkout@v4
      - name: Build Zordon and Alpha
        run: |
          go build -o zordon ./cmd/zordon/
          go build -o alpha ./cmd/alpha/
          chmod +x zordon alpha
          sudo mv zordon alpha /usr/local/bin/
      - name: Run E2E Test
        run: |
          cd examples/${{ matrix.example }}
          sudo zordon sudo
          chmod +x test.sh
          zordon start --agent
          ./test.sh
          zordon stop --agent

