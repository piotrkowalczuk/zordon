name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - debian:11
          - fedora:latest
          - archlinux:latest
        example:
          - simple
          - federation
          - worktree
    container:
      image: ${{ matrix.distro }}
    steps:
      - name: Install dependencies
        run: |
          if [ -x "$(command -v apt-get)" ]; then apt-get update && apt-get install -y git golang-go sudo make; fi
          if [ -x "$(command -v dnf)" ]; then dnf install -y git golang sudo make; fi
          if [ -x "$(command -v pacman)" ]; then pacman -Syu --noconfirm git go sudo make; fi
      - uses: actions/checkout@v4
      - name: Run Tests
        run: make test
      - name: Run E2E Test
        run: make e2e EXAMPLES=examples/${{ matrix.example }}

