name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:12
          - debian:11
          - fedora:latest
          - archlinux:latest
        example:
          - simple
          - federation
          - worktree
    container:
      image: ${{ matrix.distro }}
    env:
      CGO_ENABLED: "1"
      GO_VERSION: "1.25.6"
    steps:
      - name: Install dependencies
        run: |
          # Distro Go packages are far older than the go.mod toolchain
          # (go 1.25.6 + `tool` directive), so install the official Go
          # tarball. gcc is still needed for `go test -race` (cgo).
          if [ -x "$(command -v apt-get)" ]; then apt-get update && apt-get install -y git gcc sudo make curl ca-certificates; fi
          if [ -x "$(command -v dnf)" ]; then dnf install -y git gcc sudo make curl; fi
          if [ -x "$(command -v pacman)" ]; then pacman -Syu --noconfirm git gcc sudo make curl; fi
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          echo /usr/local/go/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - name: Trust workspace
        # The container runs as root but the checkout is owned by a
        # different uid, so git reports "dubious ownership" (exit 128).
        # That breaks `go build`'s VCS stamping ("error obtaining VCS
        # status"). Mark the tree safe before any go build/test.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Pre-place mise
        # zordon's EnsureMise bootstraps mise via `cargo install` unless
        # a binary already exists at <ZORDON_HOME>/bin/mise. The test
        # suite's ZORDON_HOME is <repo>/.zordon, so drop the official
        # static mise there: a no-op bootstrap beats compiling mise from
        # source on every distro in the matrix.
        run: |
          mkdir -p .zordon/bin
          curl -fsSL https://mise.jdx.dev/mise-latest-linux-x64 -o .zordon/bin/mise
          chmod +x .zordon/bin/mise
          .zordon/bin/mise --version
      - name: Run Tests
        run: make test
      - name: Run E2E Test
        run: make e2e EXAMPLES=examples/${{ matrix.example }}

