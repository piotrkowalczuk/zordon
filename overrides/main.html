{% extends "base.html" %}

<!-- Mirrors Material's own htmltitle block, swapping the " - " separator for
     " | ". Kept structurally identical so a theme upgrade that changes the
     branching is easy to diff against. -->
{% block htmltitle %}
  {% if page.meta and page.meta.title %}
    <title>{{ page.meta.title }} | {{ config.site_name }}</title>
  {% elif page.title and not page.is_homepage %}
    <title>{{ page.title | striptags }} | {{ config.site_name }}</title>
  {% else %}
    <title>{{ config.site_name }}</title>
  {% endif %}
{% endblock %}
